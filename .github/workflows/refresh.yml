# About every hour (started by tick.yml, and on every push to main): scan the tracked wallets,
# rebuild the datasets, check them, send the phone alerts, build the website and publish it to GitHub Pages.
# Which wallets are tracked comes from the AERO_CONFIG secret and never appears in this public
# repository or its logs; the scan cache is encrypted before it goes into the Actions cache.
#
# Two kinds of pass over the same pipeline (src/update.mjs):
# - the hourly pass reads each chain to its safe head (Ethereum's is some ten minutes old), keeps what it
#   read in the cache and feeds the alerts;
# - a fresh pass reads Ethereum to seconds behind its latest block, for the page alone, and keeps nothing.
# A full run (mode full: every hour, the schedule, a push) does the hourly pass and the alerts, saves the
# cache, then publishes from a fresh pass, so the page is as new as the run. A quick run (mode quick:
# quick.yml, every ten minutes in between) only restores the cache, makes a fresh pass and publishes: what a
# wallet did shows within minutes, not at the next hour.
#
# Everything about a run is public: when it ran, how long each step took, every line of its log and when it
# was printed, the sizes of what it saved and published. None of it may tell when a tracked wallet moved.
# Runs come at fixed times whatever the wallets do; the log says no count of what they did (lib/public.mjs);
# each pass ends on a padded time and its lines are printed only then; the alert step ends on a padded time;
# a failed hourly pass says what failed without its figures, and a fresh pass (which reads only what came
# since the hourly pass, every ten minutes) nothing but whether it went through, its checks neither; views
# and the cache are filled to whole steps of size (lib/views.mjs, scripts/cache-crypt.mjs).
name: Refresh and publish
run-name: ${{ inputs.mode == 'quick' && 'Quick refresh' || 'Refresh and publish' }}

on:
  schedule:
    # GitHub registers the schedule from the default branch; editing this line re-registers it.
    - cron: '11 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: full (the hourly run) or quick (only a fresh pass for the page; quick.yml starts these, and one started by hand can push a waiting hourly run out of the queue)
        type: choice
        options: [full, quick]
        default: full

permissions:
  actions: write # to restart the hourly tick
  contents: write # only for the keep-alive commit below
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A quick run must never keep the hourly run (and its alerts) waiting behind it for long.
    timeout-minutes: ${{ inputs.mode == 'quick' && 10 || 58 }}
    environment:
      name: github-pages
      url: ${{ steps.deploy3.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy.outputs.page_url }}
    env:
      AERO_CONFIG: ${{ secrets.AERO_CONFIG }}
      # Only a run asked for as quick is one; the schedule and a push have no inputs and are full.
      FULL: ${{ inputs.mode != 'quick' }}
    steps:
      # The quick refreshes until the next hourly run (quick.yml: one every ten minutes). Started by every full
      # run, so they follow a release at once; a newer loop takes over from an older one, and one that could
      # not be started costs the hour its quick refreshes only.
      - name: Start the hour's quick refreshes
        if: ${{ env.FULL == 'true' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run quick.yml --ref main
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Mask wallet addresses in the logs
        run: node scripts/mask.mjs
      # Keyed by run and attempt: a re-run then restores the newest cache through restore-keys, not
      # its own first attempt's, so it neither rescans nor resends alerts later runs already sent.
      - uses: actions/cache/restore@v4
        with:
          path: cache.enc
          key: scan-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: scan-cache-
      # What was asked on the page, saved apart right after it is read (below), so a run that later fails
      # or times out does not lose it.
      - uses: actions/cache/restore@v4
        with:
          path: requests.enc
          key: requests-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: requests-
      - id: open
        run: node scripts/cache-crypt.mjs open
      - name: Mask added addresses in the logs
        run: node scripts/mask.mjs extras
      # Addresses asked for on the page (lib/requests.mjs); trouble reading them must not hold back the
      # update. It gives up on what is left after 3 minutes itself; the limit here is for a hang.
      - id: requests
        name: Read requests from the page
        if: ${{ env.FULL == 'true' }}
        continue-on-error: true
        timeout-minutes: 5
        run: node scripts/requests.mjs
      # Whatever the step saved (it writes the store whole each time), even if it failed or was stopped.
      - if: ${{ !cancelled() && steps.open.outcome == 'success' && env.FULL == 'true' }}
        continue-on-error: true
        run: node scripts/cache-crypt.mjs seal-requests
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.open.outcome == 'success' && env.FULL == 'true' }}
        continue-on-error: true
        with:
          path: requests.enc
          key: requests-${{ github.run_id }}-${{ github.run_attempt }}
      # With addresses added on the page, src/update.mjs runs the update with them for at most 13 minutes
      # and, if that fails or runs out of time, at once without them, its pool samples stopping by minute
      # 29: the configured wallets are updated whatever an added address does. The limit here is for a hang,
      # well above what the configured wallets alone have needed; what was read so far is still sealed into
      # the cache below. Setup, requests (5), update (40), checks (5), alerts (3 + 1), the seal, the fresh pass (6)
      # and the publish (three tries of 2) fit the job's 58 but for every limit being hit at once.
      # AERO_PAD_SECONDS: the step ends on a padded time, the same whether or not a wallet had done anything
      # (src/update.mjs). What it says is kept back until then and printed by the next step: every line of the
      # log carries the moment it was printed, which would tell how long each part of the pass really took.
      - id: update
        if: ${{ env.FULL == 'true' }}
        timeout-minutes: 40
        env:
          AERO_PAD_SECONDS: 75
        run: npm run update > "$RUNNER_TEMP/update.log" 2>&1
      - name: What the hourly pass said
        if: ${{ !cancelled() && env.FULL == 'true' && steps.update.outcome != 'skipped' }}
        run: cat "$RUNNER_TEMP/update.log" || true
      # The limit is for a hang: a step that runs out of time fails, and the alerts, the seal and the save below
      # still run; a job that runs out of time is cancelled, and they do not.
      - id: test
        if: ${{ env.FULL == 'true' }}
        timeout-minutes: 5
        run: npm test
      # Phone alerts (lib/alerts.mjs); a failure here must not hold back the publish. When the update
      # or its checks failed they still run, from the last good data at live pool prices.
      - name: Send price alerts
        if: ${{ !cancelled() && steps.open.outcome == 'success' && env.FULL == 'true' }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          UPDATE_OK: ${{ steps.update.outcome == 'success' && steps.test.outcome == 'success' }}
        run: node scripts/alerts.mjs
      # BTC and ETH against their realized price (lib/realized.mjs): public market data only, nothing of the
      # wallets, so it runs whether or not the update went through.
      - name: Send realized-price alerts
        if: ${{ !cancelled() && steps.open.outcome == 'success' && env.FULL == 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node scripts/realized-alerts.mjs
      # Saved even after a failed update, so what it read (snapshots, scan progress, alert state)
      # carries over to the next run; nothing is published then. Not after a cancelled run, which may
      # have stopped in the middle of writing.
      - if: ${{ !cancelled() && steps.open.outcome == 'success' && env.FULL == 'true' }}
        run: node scripts/cache-crypt.mjs seal
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.open.outcome == 'success' && env.FULL == 'true' }}
        continue-on-error: true # a lost save only means the next run rescans a little more
        with:
          path: cache.enc
          key: scan-cache-${{ github.run_id }}-${{ github.run_attempt }}
      # The fresh pass, for the page: after the cache is sealed and saved, and src/update.mjs puts the cache
      # files back as they were when it is done, so nothing of it is ever kept. In a full run the hourly pass's
      # checked data is set aside first and published instead if the fresh pass or its checks fail: the page is
      # then some ten minutes behind the chain, as it always was before, which can be a few minutes older than
      # what the last quick run showed. In a quick run a failure publishes nothing and the page keeps what it has.
      - name: Set the hourly pass's data aside
        if: ${{ env.FULL == 'true' }}
        run: rm -rf out.safe && cp -R out out.safe
      # In the job a fresh pass says only whether it went through (src/update.mjs): it reads just the minutes
      # since the hourly pass, so where it failed, or which check, would date a wallet's transaction. One that
      # keeps failing is looked into on one's own machine, where it says everything.
      - id: fresh
        name: Fresh pass for the page
        continue-on-error: ${{ env.FULL == 'true' }}
        timeout-minutes: 6
        env:
          AERO_FRESH: 1
          AERO_PAD_SECONDS: 60
        run: npm run update > "$RUNNER_TEMP/fresh.log" 2>&1
      - name: What the fresh pass said
        if: ${{ !cancelled() && steps.fresh.outcome != 'skipped' }}
        run: cat "$RUNNER_TEMP/fresh.log" || true
      # What the fresh pass scanned was checked inside it, before its caches went back (src/update.mjs). Here
      # its data is checked (test/curve.test.mjs), and the scan checks run once more on the hourly pass's
      # cache, which a quick run has only just restored. Nothing of it is printed, for the same reason: a check
      # that fails names the wallet it failed for. That it failed shows; which one, in the hourly run's checks
      # once the hourly pass has read the same blocks.
      - id: freshtest
        name: Check the fresh pass's data
        if: ${{ steps.fresh.outcome == 'success' }}
        continue-on-error: ${{ env.FULL == 'true' }}
        timeout-minutes: 3
        run: npm test > /dev/null 2>&1
      - name: Publish the hourly pass's data instead
        if: ${{ env.FULL == 'true' && (steps.fresh.outcome != 'success' || steps.freshtest.outcome != 'success') }}
        run: rm -rf out && mv out.safe out
      - run: npm run build:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
          retention-days: 1
      # The deployment asks GitHub for the artifact just uploaded, which now and then is not listed yet
      # (actions/deploy-pages#451; 14 of 200 runs in a week of November 2026 failed on it, each leaving the
      # page an hour older, though the artifact was there a moment later): wait a little first, and try again
      # twice before giving up. Each try gives up after two minutes (the action's own limit is ten, and a run
      # that waited that long three times would keep the hourly run waiting). When the action looks again by
      # itself, the second and third tries can go.
      - run: sleep 5
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 120000
      - if: ${{ steps.deploy.outcome == 'failure' }}
        run: sleep 20
      - id: deploy2
        if: ${{ steps.deploy.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 120000
      - if: ${{ steps.deploy2.outcome == 'failure' }}
        run: sleep 60
      - id: deploy3
        if: ${{ steps.deploy2.outcome == 'failure' }}
        uses: actions/deploy-pages@v4
        with:
          timeout: 120000
      # GitHub turns off scheduled workflows after 60 days without a commit; keep this one alive.
      - name: Keep the schedule alive
        if: ${{ env.FULL == 'true' }}
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep the hourly refresh enabled"
            git push origin HEAD:main
          fi
      # tick.yml starts these runs every hour; restart its chain if it has stopped.
      - name: Keep the hourly tick going
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Could it not be asked, nothing is restarted this run: the next run asks again.
          open=$(timeout 60 gh run list --workflow tick.yml --limit 20 --json status --jq '[.[] | select(.status != "completed")] | length' || echo unknown)
          if [ "$open" = 0 ]; then gh workflow run tick.yml --ref main; fi
