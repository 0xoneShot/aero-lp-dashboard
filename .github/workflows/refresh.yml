# About every hour (started by tick.yml, and on every push to main): scan the tracked wallets,
# rebuild the datasets, check them, build the website and publish it to GitHub Pages.
# Which wallets are tracked comes from the AERO_CONFIG secret and never appears in this public
# repository or its logs; the scan cache is encrypted before it goes into the Actions cache.
name: Refresh and publish

on:
  schedule:
    # GitHub registers the schedule from the default branch; editing this line re-registers it.
    - cron: '11 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write # to restart the hourly tick
  contents: write # only for the keep-alive commit below
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      AERO_CONFIG: ${{ secrets.AERO_CONFIG }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Mask wallet addresses in the logs
        run: node scripts/mask.mjs
      # Keyed by run and attempt: a re-run then restores the newest cache through restore-keys, not
      # its own first attempt's, so it neither rescans nor resends alerts later runs already sent.
      - uses: actions/cache/restore@v4
        with:
          path: cache.enc
          key: scan-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: scan-cache-
      - run: node scripts/cache-crypt.mjs open
      - run: npm run update
      - run: npm test
      # Phone alerts (lib/alerts.mjs); a failure here must not hold back the publish.
      - name: Send price alerts
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node scripts/alerts.mjs
      - run: node scripts/cache-crypt.mjs seal
      - uses: actions/cache/save@v4
        continue-on-error: true # a lost save only means the next run rescans a little more
        with:
          path: cache.enc
          key: scan-cache-${{ github.run_id }}-${{ github.run_attempt }}
      - run: npm run build:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
          retention-days: 1
      - id: deploy
        uses: actions/deploy-pages@v4
      # GitHub turns off scheduled workflows after 60 days without a commit; keep this one alive.
      - name: Keep the schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep the hourly refresh enabled"
            git push origin HEAD:main
          fi
      # tick.yml starts these runs every hour; restart its chain if it has stopped.
      - name: Keep the hourly tick going
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          open=$(gh run list --workflow tick.yml --limit 20 --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$open" = 0 ]; then gh workflow run tick.yml --ref main; fi
