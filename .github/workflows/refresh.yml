# Every hour (and on every push to main): scan the tracked wallets, rebuild the datasets, check
# them, build the website and publish it to GitHub Pages.
# Which wallets are tracked comes from the AERO_CONFIG secret and never appears in this public
# repository or its logs; the scan cache is encrypted before it goes into the Actions cache.
name: Refresh and publish

on:
  schedule:
    # GitHub registers the schedule from the default branch; editing this line re-registers it.
    - cron: '11 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # only for the keep-alive commit below
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      AERO_CONFIG: ${{ secrets.AERO_CONFIG }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Mask wallet addresses in the logs
        run: node scripts/mask.mjs
      - uses: actions/cache/restore@v4
        with:
          path: cache.enc
          key: scan-cache-${{ github.run_id }}
          restore-keys: scan-cache-
      - run: node scripts/cache-crypt.mjs open
      - run: npm run update
      - run: npm test
      - run: node scripts/cache-crypt.mjs seal
      - uses: actions/cache/save@v4
        continue-on-error: true # a re-run of the same run id cannot save under its key again
        with:
          path: cache.enc
          key: scan-cache-${{ github.run_id }}
      - run: npm run build:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
          retention-days: 1
      - id: deploy
        uses: actions/deploy-pages@v4
      # GitHub turns off scheduled workflows after 60 days without a commit; keep this one alive.
      - name: Keep the schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep the hourly refresh enabled"
            git push origin HEAD:main
          fi
